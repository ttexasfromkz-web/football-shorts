name: Render video
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack project
        run: unzip -q -o "$(ls *.zip | head -1)"
      - name: Use video.json from the repo root (if present)
        run: |
          if [ -f video.json ]; then cp video.json football-top10/data/video.json; echo "Using video.json"; fi
      - name: System libraries for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install packages
        working-directory: football-top10
        run: npm install
      - name: Voiceover
        working-directory: football-top10
        run: npm run voice
      - name: Render video
        working-directory: football-top10
        run: npm run render
      - name: Publish mp4 to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "video-${{ github.run_number }}-${{ github.run_attempt }}" football-top10/out/top10.mp4 --title "Video ${{ github.run_number }}.${{ github.run_attempt }}" --notes "Rendered video"
